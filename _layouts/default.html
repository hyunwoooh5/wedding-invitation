<!DOCTYPE html>
<html lang="{{ page.language | default: 'ko' }}" data-initial-language="{{ page.language | default: 'ko' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <meta id="page-description" name="description" content="{{ page.description | default: site.data.wedding.ko.description | default: site.description }}" />
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta id="og-page-description" property="og:description" content="{{ page.description | default: site.data.wedding.ko.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=8" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="site-title">
          <span class="heart">❤️</span>
          {{ site.title }}
        </div>
        <nav class="site-nav">
          <a href="#cover" data-key="page.nav.cover">초대</a>
          <a href="#venue" data-key="page.nav.venue">예식장</a>
          <a href="#gallery" data-key="page.nav.gallery">갤러리</a>
        </nav>
        <button id="lang-toggle" class="language-toggle" type="button" aria-label="語言切換">TW</button>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p></p>
      </footer>
    </div>
    <script>
      window.weddingData = {{ site.data.wedding | jsonify }};
    </script>
    <script src="{{ site.baseurl }}/assets/js/main.js?v=6"></script>
  </body>
</html>
